<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>טריוויה הלכות ברכות - קיצור ילקוט יוסף</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">🍷 טיול מאורגן • טריוויה באוטובוס</div>
      <h1>טריוויה הלכות ברכות</h1>
      <p class="subtitle">72 כרטיסיות הלכה עפ"י ספר קיצור ילקוט יוסף כרך א'</p>
    </header>

    <main class="glass-card">
      <!-- Reconnect Banner if player was in an active room -->
      <div id="reconnectBanner" style="display: none; margin-bottom: 20px; background: rgba(255,215,0,0.15); border: 1px solid var(--gold-accent); padding: 16px; border-radius: var(--radius-md); text-align: center;">
        <p style="color: var(--gold-accent); font-weight: 800; font-size: 1.1rem; margin-bottom: 8px;">אתה באמצע משחק פעיל! 🎮</p>
        <button id="reconnectBtn" class="btn-primary">🔄 חזרה למשחק (חדר <span id="reconnectRoomCode">----</span>)</button>
      </div>

      <h2 style="color: var(--gold-primary); margin-bottom: 16px; font-size: 1.3rem; text-align: center;">הצטרפות למשחק</h2>
      
      <form id="joinForm">
        <div class="input-group">
          <label class="input-label" for="playerName">השם שלך:</label>
          <input type="text" id="playerName" class="input-field" placeholder="הכנס את שמך" required autocomplete="off">
        </div>

        <div class="input-group">
          <label class="input-label" for="roomCode">קוד חדר (4 ספרות):</label>
          <input type="number" id="roomCode" class="input-field" placeholder="לדוגמה: 1234" required autocomplete="off">
        </div>

        <div class="input-group">
          <label class="input-label" for="dedicationInput">🕯️ הקדשת הלימוד לרפואה / לעילוי נשמת למשחק זה (אופציונלי):</label>
          <input type="text" id="dedicationInput" class="input-field" placeholder="לדוגמה: לרפואת משה בן שרה..." autocomplete="off">
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 10px;">כניסה למשחק 🚀</button>
      </form>
    </main>
  </div>

  <script>
    // Generate persistent playerId if not present
    let playerId = localStorage.getItem('playerId');
    if (!playerId) {
      playerId = 'player_' + Math.random().toString(36).substring(2, 10) + Date.now();
      localStorage.setItem('playerId', playerId);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if (roomParam) {
      document.getElementById('roomCode').value = roomParam;
    }

    const activeRoomCode = localStorage.getItem('activeRoomCode');
    const savedName = localStorage.getItem('playerName');
    if (activeRoomCode && savedName) {
      document.getElementById('reconnectBanner').style.display = 'block';
      document.getElementById('reconnectRoomCode').innerText = activeRoomCode;
      document.getElementById('reconnectBtn').addEventListener('click', () => {
        window.location.href = `player.html?room=${activeRoomCode}`;
      });
    }

    document.getElementById('joinForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const playerName = document.getElementById('playerName').value.trim();
      const roomCode = document.getElementById('roomCode').value.trim();
      const dedication = document.getElementById('dedicationInput').value.trim();

      if (playerName && roomCode) {
        localStorage.setItem('playerName', playerName);
        localStorage.setItem('activeRoomCode', roomCode);
        localStorage.setItem('lastRoomCode', roomCode);
        if (dedication) {
          localStorage.setItem('dedication', dedication);
        } else {
          localStorage.removeItem('dedication');
        }
        window.location.href = `player.html?room=${roomCode}`;
      }
    });
  </script>
</body>
</html>
